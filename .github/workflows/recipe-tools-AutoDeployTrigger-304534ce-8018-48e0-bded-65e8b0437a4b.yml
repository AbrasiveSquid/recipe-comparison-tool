name: Trigger auto deployment for recipe-tools

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.RECIPETOOLS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.RECIPETOOLS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.RECIPETOOLS_AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy container
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}
          containerAppName: recipe-tools
          resourceGroup: recipe-tools-rg
          imageToBuild: ghcr.io/abrasivesquid/recipe-comparison-tool:${{ github.sha }}

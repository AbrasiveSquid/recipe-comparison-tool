name: Trigger auto deployment for recipe-tools

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/recipe-tools-AutoDeployTrigger-304534ce-8018-48e0-bded-65e8b0437a4b.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.RECIPETOOLS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.RECIPETOOLS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.RECIPETOOLS_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: ghcr.io
          registryUsername: ${{ secrets.RECIPETOOLS_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.RECIPETOOLS_REGISTRY_PASSWORD }}
          containerAppName: recipe-tools
          resourceGroup: recipe-tools-rg
          imageToBuild: ghcr.io/recipe-tools:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_



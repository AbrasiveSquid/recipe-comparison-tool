name: Test and deploy recipe-tools

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      SECRET_KEY: ci-test-only-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Verify application startup
        run: python -c "from recipe_comparison import app"
  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.RECIPETOOLS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.RECIPETOOLS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.RECIPETOOLS_AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy container
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}
          containerAppName: recipe-tools
          resourceGroup: recipe-tools-rg
          environmentVariables: SECRET_KEY=secretref:flask-secret-key
          imageToBuild: ghcr.io/abrasivesquid/recipe-comparison-tool:${{ github.sha }}
          targetPort: 8000

      - name: Remove temporary registry credentials
        run: |
          az containerapp registry remove \
            --name recipe-tools \
            --resource-group recipe-tools-rg \
            --server ghcr.io
